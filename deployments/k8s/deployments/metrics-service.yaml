apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: goforge
  labels:
    app: metrics-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-service
  template:
    metadata:
      labels:
        app: metrics-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: metrics-service
        image: goforge/metrics-service:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50053
          name: grpc
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "metrics-service"
        - name: SERVICE_VERSION
          value: "v1.0.0"
        - name: GRPC_PORT
          value: "50053"
        - name: PROMETHEUS_PORT
          value: "9090"
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          grpc:
            port: 50053
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 50053
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  namespace: goforge
  labels:
    app: metrics-service
spec:
  type: ClusterIP
  ports:
  - port: 50053
    targetPort: 50053
    protocol: TCP
    name: grpc
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: metrics-service
