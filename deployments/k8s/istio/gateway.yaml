apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: goforge-gateway
  namespace: goforge
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: goforge-tls-cert
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: goforge-routes
  namespace: goforge
spec:
  hosts:
  - "*"
  gateways:
  - goforge-gateway
  http:
  - match:
    - uri:
        prefix: "/api"
    route:
    - destination:
        host: api-gateway
        port:
          number: 50050
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,reset,connect-failure,refused-stream
    timeout: 10s
  - match:
    - uri:
        prefix: "/model"
    route:
    - destination:
        host: model-service
        port:
          number: 50051
    retries:
      attempts: 3
      perTryTimeout: 2s
    timeout: 30s
  - match:
    - uri:
        prefix: "/auth"
    route:
    - destination:
        host: auth-service
        port:
          number: 50052
    timeout: 5s
