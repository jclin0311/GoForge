apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: goforge
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-authenticated
  namespace: goforge
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/goforge/sa/*"]
    to:
    - operation:
        methods: ["*"]
