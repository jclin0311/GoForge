apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: goforge-services
  namespace: goforge
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: model-service
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
