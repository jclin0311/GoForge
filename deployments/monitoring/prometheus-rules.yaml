apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: goforge-alerts
  namespace: goforge
  labels:
    release: prometheus
spec:
  groups:
  - name: goforge.rules
    interval: 30s
    rules:
    - alert: HighErrorRate
      expr: |
        (sum(rate(grpc_requests_total{namespace="goforge",status="error"}[5m])) by (service)
        / sum(rate(grpc_requests_total{namespace="goforge"}[5m])) by (service)) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate detected in {{ $labels.service }}"
        description: "Error rate is {{ $value | humanizePercentage }} for service {{ $labels.service }}"

    - alert: HighLatency
      expr: |
        histogram_quantile(0.95, sum(rate(grpc_request_duration_seconds_bucket{namespace="goforge"}[5m])) by (service, le)) > 0.3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High latency detected in {{ $labels.service }}"
        description: "P95 latency is {{ $value }}s for service {{ $labels.service }}"

    - alert: ServiceDown
      expr: up{namespace="goforge"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Service {{ $labels.job }} is down"
        description: "Service {{ $labels.job }} has been down for more than 1 minute"

    - alert: HighMemoryUsage
      expr: |
        (sum(container_memory_usage_bytes{namespace="goforge"}) by (pod)
        / sum(container_spec_memory_limit_bytes{namespace="goforge"}) by (pod)) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage in {{ $labels.pod }}"
        description: "Memory usage is {{ $value | humanizePercentage }} for pod {{ $labels.pod }}"

    - alert: HighCPUUsage
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace="goforge"}[5m])) by (pod) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage in {{ $labels.pod }}"
        description: "CPU usage is {{ $value | humanizePercentage }} for pod {{ $labels.pod }}"

    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total{namespace="goforge"}[15m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.pod }} is crash looping"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
