syntax = "proto3";

package goforge.metrics;

option go_package = "github.com/goforge/ai-platform/pkg/proto;proto";

// MetricsService handles metrics collection and reporting
service MetricsService {
  rpc RecordMetric(MetricRequest) returns (MetricResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message MetricRequest {
  string metric_name = 1;
  double value = 2;
  map<string, string> labels = 3;
  int64 timestamp = 4;
  MetricType type = 5;
}

message MetricResponse {
  bool success = 1;
  string message = 2;
}

message GetMetricsRequest {
  string metric_name = 1;
  map<string, string> labels = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}

message GetMetricsResponse {
  repeated Metric metrics = 1;
}

message Metric {
  string name = 1;
  double value = 2;
  map<string, string> labels = 3;
  int64 timestamp = 4;
  MetricType type = 5;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string status = 2;
}

enum MetricType {
  METRIC_TYPE_UNKNOWN = 0;
  METRIC_TYPE_COUNTER = 1;
  METRIC_TYPE_GAUGE = 2;
  METRIC_TYPE_HISTOGRAM = 3;
  METRIC_TYPE_SUMMARY = 4;
}
