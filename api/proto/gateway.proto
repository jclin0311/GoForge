syntax = "proto3";

package goforge.gateway;

option go_package = "github.com/goforge/ai-platform/pkg/proto;proto";

// Gateway service for unified API access
service GatewayService {
  rpc RouteRequest(RouteRequestMessage) returns (RouteResponseMessage);
  rpc GetServiceHealth(ServiceHealthRequest) returns (ServiceHealthResponse);
}

message RouteRequestMessage {
  string service_name = 1;
  string method = 2;
  bytes payload = 3;
  map<string, string> headers = 4;
  string request_id = 5;
}

message RouteResponseMessage {
  int32 status_code = 1;
  bytes payload = 2;
  map<string, string> headers = 3;
  string request_id = 4;
  int64 latency_ms = 5;
}

message ServiceHealthRequest {
  string service_name = 1;
}

message ServiceHealthResponse {
  string service_name = 1;
  bool healthy = 2;
  string status = 3;
  map<string, string> details = 4;
}
